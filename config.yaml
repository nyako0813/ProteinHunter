# ==========================================================
# Protein Hunter v5 Configuration File
# ==========================================================

project:
  name: ProteinHunter
  version: "5.0"

input_mode: directory

# ----------------------------------------------------------
# Input / Output
# ----------------------------------------------------------
paths:
  # Directory mode can use NCBI folders placed directly under these directories.
  # Set input_mode: directory to use these instead of the single FASTA files above.
  target_dir: "./data/databases/target"
  positive_dir: "./data/databases/positive"
  negative_dir: "./data/databases/negative"

  # Optional genome annotation
  gff: "./data/input/genome.gff"

  # Output Excel
  output_excel: "./data/output/ProteinHunter_results.xlsx"

  # Cache directory
  cache_dir: "./.cache"

  # Log directory
  log_dir: "./logs"


# ----------------------------------------------------------
# BLAST
# ----------------------------------------------------------

blast:

  evalue: 1e-5

  max_target_seqs: 10

  threads: auto


# ----------------------------------------------------------
# Annotation
# ----------------------------------------------------------

annotation:

  enable_cdd: true

  enable_pfam: true

  enable_alphafold: true

  enable_uniprot: true

  enable_gene_context: true

  cdd_threads: 4

  pfam_threads: 4

  pfam_evalue_threshold: 1e-5

  alphafold_threads: 4


# ----------------------------------------------------------
# Annotation Targets
# ----------------------------------------------------------

annotation_targets:
  candidates:
    gff: true
    pfam: true
    uniprot: true
    alphafold: true

  positive_all_sources:
    gff: true
    pfam: true
    uniprot: true
    alphafold: true

  no_hit:
    gff: true
    pfam: false
    uniprot: false
    alphafold: false

  negative_unmatched:
    gff: true
    pfam: false
    uniprot: false
    alphafold: false

  negative_hit:
    gff: true
    pfam: false
    uniprot: false
    alphafold: false


# ----------------------------------------------------------
# Cache
# ----------------------------------------------------------

cache:

  enabled: true

  overwrite: false


# ----------------------------------------------------------
# Score
# ----------------------------------------------------------

score:

  blast_weight: 5

  domain_weight: 4

  motif_weight: 3

  gene_context_weight: 3

  alphafold_weight: 2


# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------

logging:

  level: INFO

  save_log: true
