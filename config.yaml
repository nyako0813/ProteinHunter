# ==========================================================
# Protein Hunter v5 Configuration File
# ==========================================================

project:
  name: ProteinHunter
  version: "5.0"

input_mode: directory

#他生物種の遺伝子を考慮するならtrue、考慮しないならfalse
#このスイッチは candidate_sources / ranking_metric / max_candidates_per_query の既定値を切り替える
#(annotation_targetsのgffは、このスイッチに関係なく全シートで既定true)
#個別選択したいところはコメントアウトせずに選択する→個別選択が優先される
consider_cross_species_matches: true

#Word報告書の言語。"en"(英語、既定)または "ja"(日本語)
#見出し・説明文だけが切り替わる。遺伝子座番号・スコア・分類値はExcelと同じ英語表記のまま
#Excel出力は、この設定に関係なく英語のまま
report_language: "en"

# Notion出力(第三の出力。ExcelとWordはそのまま生成される)。既定はオフ
# 有効にすると、実行ごとのRunページ→候補データベース→候補ごとのページを、下のページ配下に作る
# APIトークンはここに書かない。環境変数 NOTION_TOKEN から読む(未設定なら警告してスキップ)
# parent_page_id は出力先ページのID(URL末尾の32桁)。秘匿情報ではない。
# このページをNotionの内部インテグレーションに共有(「接続」に追加)しておくこと
notion_export:
  enabled: false
  parent_page_id: "3e1ef408bf298005a303f93efcff9871"

# ----------------------------------------------------------
# Input / Output
# ----------------------------------------------------------
paths:
  # Directory mode can use NCBI folders placed directly under these directories.
  # Set input_mode: directory to use these instead of the single FASTA files above.
  target_dir: "./data/databases/target"
  positive_dir: "./data/databases/positive"
  negative_dir: "./data/databases/negative"

  # Optional genome annotation
  gff: "./data/input/genome.gff"

  # Output Excel
  output_excel: "./data/output/MA_4115_3.xlsx"

  # Output Word report (Phase 6-8 Stage 2). Optional -- when unset,
  # defaults to output_excel's directory/stem with a .docx extension
  # (e.g. "./data/output/ProteinHunter_results.docx"). See
  # interaction_scoring.word_report to disable report generation or
  # change how many candidates per query it includes.
  # output_word: "./data/output/ProteinHunter_results.docx"

  # Cache directory
  cache_dir: "./.cache"

  # Log directory
  log_dir: "./logs"


# ----------------------------------------------------------
# BLAST
# ----------------------------------------------------------

blast:

  evalue: 1e-5

  max_target_seqs: 10

  threads: auto


# ----------------------------------------------------------
# Annotation
# ----------------------------------------------------------

annotation:

  enable_cdd: true

  enable_pfam: true

  enable_alphafold: true

  enable_uniprot: true

  enable_gene_context: true

  cdd_threads: 4

  pfam_threads: 4

  pfam_evalue_threshold: 1e-5

  alphafold_threads: 4


# ----------------------------------------------------------
# Annotation Targets
# ----------------------------------------------------------

# gff defaults to true on every sheet (independent of
# consider_cross_species_matches): GFF annotation supplies old_locus_tag,
# which STRING/GEO evidence is looked up by, and it costs ~0.2 s for the
# whole genome. Set gff: false on a sheet only to opt out deliberately.
annotation_targets:
  candidates:
    gff: true
    pfam: false
    uniprot: false
    alphafold: false

  candidates_relaxed:
    gff: true
    pfam: false
    uniprot: false
    alphafold: false

  positive_all_sources:
    #gff: true
    pfam: false
    uniprot: false
    alphafold: false

  no_hit:
    #gff: true
    pfam: false
    uniprot: false
    alphafold: false

  negative_unmatched:
    #gff: true
    pfam: false
    uniprot: false
    alphafold: false

  negative_hit:
    #gff: true
    pfam: false
    uniprot: false
    alphafold: false


# ----------------------------------------------------------
# Ortholog-aware Negative Hit Filter
# ----------------------------------------------------------

ortholog_filter:
  negative_exclusion_mode: strong_only

  strong:
    min_identity: 40.0
    min_query_coverage: 70.0
    max_evalue: 1e-5

  medium:
    min_identity: 30.0
    min_query_coverage: 70.0
    max_evalue: 1e-5

  weak:
    min_identity: 25.0
    min_query_coverage: 50.0
    max_evalue: 1e-3


# ----------------------------------------------------------
# Lightweight Interaction Candidate Ranking
# ----------------------------------------------------------

interaction_scoring:
  enabled: true

#protein_idはncbiのWPから始まる個別番号
#どれか一つが入力されていれば機能する
#ただし、genome.gffに存在しない場合はsequenceやquery_fastaの入力が必要
  query_proteins:
    - protein_id: "WP_011024006.1"
      old_locus_tag: "MA_4115"
      sequence: ""

  query_fasta: ""

  # negative_hit (and its three sub-buckets) are OFF by default because
  # they are usually large and, for most queries, dominated by unrelated
  # proteins. Broadly conserved proteins can still land in Negative_hit
  # (e.g. DnaK has a strong hit in the negative references), and with the
  # default left as-is a candidate in that bucket never appears in the
  # Interaction_* output at all. If your query belongs to a very widely
  # conserved pathway or complex and expected partners are missing from the
  # output, consider enabling negative_hit below.
  #
  # Caveat -- verify before relying on this: an earlier diagnostic
  # (claude/experimental_interactions_calibration_report.md) concluded that
  # curated true partners (HdrD1-Mer, MtpA-MtpC, Nif*, Mcr*) routinely fall
  # into Negative_hit. That result was largely an artifact of a mislabeled
  # negative reference genome (negative/Sulfolobus_solfataricus held a copy
  # of the positive M. maripaludis genome; fixed 2026-09-20, see
  # claude/negative_reference_genome_mixup_investigation.md). With the
  # correct genome, 14 of 17 curated partner proteins are in Candidates and
  # only 3 (DnaK, Mer, Hsp20) stay in Negative_hit.
  #
  # If you do enable negative_hit, do NOT also enable
  # negative_strong_hit/negative_medium_hit/negative_weak_hit at the same
  # time: they are subsets of negative_hit (every strong/medium/weak hit is
  # already a negative_hit), so enabling both scores and reports the same
  # candidate twice, once per bucket, under two different Interaction_*
  # sheets (Interaction_Neg_hit and Interaction_Neg_strong/medium/weak)
  # with different candidate_rank values for the same pair (seen in the
  # calibration report: one pair ranked 106/2088 in Interaction_Neg_hit and
  # 2/780 in Interaction_Neg_strong; figures from a run made before the
  # genome fix above, the double-reporting itself is independent of it).
  # Enable negative_hit alone, or one of the strength sub-buckets alone,
  # not both.
  candidate_sources:
    candidates: true
    candidates_relaxed: true
    #positive_all_sources: false
    #negative_unmatched: false
    no_hit: true
    #negative_hit: false
    negative_strong_hit: false
    negative_medium_hit: false
    negative_weak_hit: false

  #max_candidates_per_query: 200
  include_sequences_in_excel: false

  # Scope of the optional Interaction_Evidence_Detail sheet (component-level
  # breakdown, scoring_model: v2_evidence_based; a per-pair wide projection
  # of existing columns for legacy_additive). no_hit is excluded by default
  # because it is usually the largest bucket and, for v2, its ranks/scores
  # are heavily tied.
  evidence_detail_sheet:
    include_no_hit: false

  # Phase 6-8 Stage 2: the single-file Word report generated alongside the
  # Excel workbook (see paths.output_word). max_candidates_per_query is a
  # display-count knob only -- it does not affect scoring or the Excel
  # workbook. A candidate reaching Tier1_VeryStrong or Tier2_Strong is
  # always included regardless of this count; see
  # claude/phase678_stage2_word_report_investigation.md.
  word_report:
    enabled: true
    max_candidates_per_query: 15

  scoring_weights:
    candidate_priority: 30
    gene_neighborhood: 25
    co_occurrence: 20
    domain_complementarity: 15
    alphafold_readiness: 10
    # legacy_additive counterpart of v2's external_ppi_evidence category
    # cap (Phase 6a M4). Only used when string_ppi_ncbi_taxon_id is set.
    external_ppi: 15

  alphafold:
    enabled: false
    max_pair_total_length: 2500

  # Scoring model v2 (evidence-based, category-capped scoring). This is
  # opt-in and defaults to "legacy_additive" so existing runs are
  # unaffected. Set to "v2_evidence_based" to use the new engine, which
  # distinguishes "no evidence" from "evaluated, no match", caps correlated
  # evidence per category (source_classification / genomic_context /
  # functional_annotation) instead of adding raw points, and reports an
  # Evidence_Tier per candidate. See docs/scoring_engine_v2.md.
  scoring_model: v2_evidence_based

  # Optional path to a scoring engine config YAML (category caps, negative
  # penalty cap, minimum evidence for a formal score, tier thresholds).
  # Leave unset to use the built-in defaults.
  # scoring_engine_config: "config/scoring_engine.example.yaml"

  # Optional path to a functional complementarity ruleset YAML (used only
  # by scoring_model: v2_evidence_based). Leave unset to use the built-in
  # v1 ruleset at config/functional_complementarity_rules.v1.yaml.
  # functional_complementarity_ruleset: "config/functional_complementarity_rules.v1.yaml"

  # Optional path to a ProteinInteractionHunter (PIH) candidate_evidence_bundle.jsonl
  # file (used only by scoring_model: v2_evidence_based). PIH is a separate,
  # independent project and is never imported here -- this only reads its
  # own JSONL output as plain data. Only PIH's cellular_compatibility,
  # evolutionary, and direct_interaction categories are bridged in (v5
  # already computes its own genomic_context and functional_annotation, so
  # PIH's versions of those two are intentionally ignored to avoid double
  # counting). Leave unset to run without PIH evidence at all -- a missing
  # or absent file only produces a warning, never an error. See
  # analysis/pih_evidence_bridge.py and docs/scoring_engine_v2.md.
  # pih_evidence_bundle: "path/to/candidate_evidence_bundle.jsonl"

  # Which score determines candidate_rank / row order within each
  # Interaction_* sheet (design spec section 22, protein_hunter_score /
  # interaction_score split). "interaction_priority_score" (default)
  # preserves the original ranking behavior unchanged. "interaction_score"
  # ranks by query-specific evidence only (genomic_context +
  # domain_complementarity; co_occurrence and candidate quality excluded --
  # see analysis/interaction_scoring.py::INTERACTION_SCORE_COMPONENT_NAMES).
  # "final_score" (Final Score integration phase, design spec sections
  # 17-22/27; see claude/final_score_integration_investigation.md) ranks by
  # the combined protein_hunter_score+interaction_score Final Score.
  # KNOWN LIMITATION for "final_score": protein_hunter_score is only known
  # after each query's candidates have already been ranked and truncated to
  # max_candidates_per_query by whichever metric produced candidate_rank at
  # that point, so this re-ranks *within* that already-selected set, not a
  # full re-selection from every scored candidate -- see
  # analysis/interaction_scoring.py::_rerank_by_final_score. In every case,
  # interaction_priority_score/evidence_tier/priority_group/final_score/
  # final_score_tier columns keep their original values either way -- only
  # candidate_rank/row order change.
  #ranking_metric: interaction_priority_score
  domain_family_map_path: config/domain_family_map.v1.yaml
  uniprot_bulk_export_path: data/databases/uniprot/uniprotkb_methanosarcina_acetivorans.json

  # Optional NCBI taxonomy id for STRING (string-db.org) PPI evidence
  # (Phase 6a, used only by scoring_model: v2_evidence_based; see
  # claude/phase6_external_evidence_design.md). Must be STRING's own taxid
  # for the exact strain -- this is not always the species-level NCBI
  # taxid. For this project's target (Methanosarcina acetivorans C2A,
  # GCF_000007345.1) the species-level taxid 2214 returns nothing from
  # STRING; the strain-level taxid 188937 is the one with data. Leave
  # unset (the default) to disable STRING evidence entirely -- enabling it
  # downloads a per-species bulk file (tens of MB) from string-db.org on
  # first use.
  string_ppi_ncbi_taxon_id: 188937

  # Optional public GEO coexpression evidence (Phase 6b, used only by
  # scoring_model: v2_evidence_based; see
  # claude/phase6b_coexpression_design.md). Enables both the GSE77738
  # (acetate/methanol/trimethylamine growth) and GSE64349 (methylated
  # sulfur compounds) bridges together -- the accessions themselves are
  # fixed to this project's target organism, not configurable. False (the
  # default) disables both -- enabling it downloads a few MB of processed
  # RNA-seq supplementary files from NCBI GEO on first use.
  geo_coexpression_enabled: true

  # Rockhopper-predicted-operon evidence (Phase 6f, used by both scoring
  # models -- v2_evidence_based's genomic_context/rockhopper_operon
  # component and legacy_additive's rockhopper_operon_score; see
  # claude/phase6e_rockhopper_lk57_validation.md). Unlike
  # string_ppi_ncbi_taxon_id above, this is a plain on/off switch with no
  # id/path to configure -- there is no live Rockhopper execution at
  # scoring time, only a pre-computed, repo-committed cache
  # (data/cache/rockhopper_operons.json, see
  # analysis/rockhopper_operon_bridge.py) covering 4 representative
  # growth conditions. A pair Rockhopper did not group into the same
  # predicted operon is reported as MISSING (not evaluated), never as
  # negative evidence -- see the design rationale in
  # patches/claude_code_instructions_rockhopper_implementation.md.
  rockhopper_operon_enabled: true


# ----------------------------------------------------------
# Cache
# ----------------------------------------------------------

cache:

  enabled: true

  overwrite: false


# ----------------------------------------------------------
# Score
# ----------------------------------------------------------

score:

  blast_weight: 5

  domain_weight: 4

  motif_weight: 3

  gene_context_weight: 3

  alphafold_weight: 2


# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------

logging:

  level: INFO

  save_log: true
