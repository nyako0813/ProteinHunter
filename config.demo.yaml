# ==========================================================
# Protein Hunter v5 Demo Configuration File
# ==========================================================

project:
  name: ProteinHunter
  version: "5.0-demo"

input_mode: file

paths:
  target_fasta: "./data/demo/target_demo.faa"
  positive_fasta: "./data/demo/positive_demo.faa"
  negative_fasta: "./data/demo/negative_demo.faa"
  gff: "./data/input/genome.gff"
  output_excel: "./data/output/ProteinHunter_demo_results.xlsx"
  cache_dir: "./.cache"
  log_dir: "./logs"

blast:
  evalue: 1e-5
  max_target_seqs: 10
  threads: auto

annotation:
  enable_cdd: false
  enable_pfam: false
  enable_alphafold: false
  enable_uniprot: false
  enable_gene_context: false
  cdd_threads: 1
  pfam_threads: 1
  alphafold_threads: 1

annotation_targets:
  candidates:
    gff: true
    pfam: true
    uniprot: true
    alphafold: true
  candidates_relaxed:
    gff: true
    pfam: true
    uniprot: false
    alphafold: false
  positive_all_sources:
    gff: true
    pfam: true
    uniprot: true
    alphafold: true
  no_hit:
    gff: true
    pfam: false
    uniprot: false
    alphafold: false
  negative_unmatched:
    gff: true
    pfam: false
    uniprot: false
    alphafold: false
  negative_hit:
    gff: true
    pfam: false
    uniprot: false
    alphafold: false

ortholog_filter:
  negative_exclusion_mode: strong_only
  strong:
    min_identity: 40.0
    min_query_coverage: 70.0
    max_evalue: 1e-5
  medium:
    min_identity: 30.0
    min_query_coverage: 70.0
    max_evalue: 1e-5
  weak:
    min_identity: 25.0
    min_query_coverage: 50.0
    max_evalue: 1e-3

interaction_scoring:
  enabled: false
  query_proteins:
    - protein_id: ""
      old_locus_tag: ""
      sequence: ""
  query_fasta: ""
  candidate_sources:
    candidates: true
    candidates_relaxed: true
    positive_all_sources: false
    negative_unmatched: false
    no_hit: true
    negative_hit: false
    negative_strong_hit: false
    negative_medium_hit: false
    negative_weak_hit: false
  max_candidates_per_query: 200
  include_sequences_in_excel: false
  evidence_detail_sheet:
    include_no_hit: false
  ranking_metric: interaction_priority_score
  scoring_weights:
    candidate_priority: 30
    gene_neighborhood: 25
    co_occurrence: 20
    domain_complementarity: 15
    alphafold_readiness: 10
  alphafold:
    enabled: false
    max_pair_total_length: 2500

cache:
  enabled: true
  overwrite: false

score:
  blast_weight: 5
  domain_weight: 4
  motif_weight: 3
  gene_context_weight: 3
  alphafold_weight: 2

logging:
  level: INFO
  save_log: true
