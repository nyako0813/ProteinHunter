# Example configuration for scoring model v2 (evidence-based scoring).
#
# This file is NOT loaded automatically. Copy it, edit the numbers, and
# point interaction_scoring.scoring_engine_config at your copy in
# config.yaml. Leaving interaction_scoring.scoring_engine_config unset uses
# these exact values as the built-in default (see
# analysis/scoring_engine_config.py: DEFAULT_SCORING_ENGINE_CONFIG).
#
# None of these numbers are biologically calibrated yet -- they reproduce
# the point budget of the old additive scorer as a safe starting point.
# Once known interacting / non-interacting pairs are available, recalibrate
# them (see the design specification, section 37) rather than guessing.

output_scale: 100

# Maximum points each evidence category can contribute to the final score.
# Only categories with at least one AVAILABLE component for a given pair
# count toward the total; a category with no evidence is excluded from the
# denominator, not scored as zero.
#
# IMPORTANT: every category name any POSITIVE (is_negative=False) evidence
# component can attach to MUST have an entry here, or scoring will raise a
# ConfigError the first time that category actually fires for a pair (see
# analysis/scoring_engine.py::_score_categories). Negative-flagged
# components (currently only negative_hit_strength, category
# "source_reliability") are exempt -- they are summed into
# negative_penalty_cap below instead and never look at category_caps, so
# "source_reliability" deliberately has no entry here. If you add a new
# *positive* evidence component with a new category name, add its cap here
# too. tests/test_scoring_engine_config.py::test_example_config_matches_defaults
# guards this file against silently drifting out of sync with the built-in
# defaults again.
category_caps:
  source_classification: 30       # BLAST positive/negative classification source
  genomic_context: 25             # GFF-based gene neighborhood distance
  functional_annotation: 20       # co_occurrence + domain_complementarity (shared cap)
  pih_cellular_compatibility: 5   # optional ProteinInteractionHunter bridge (see interaction_scoring.pih_evidence_bundle)
  pih_evolutionary: 10            # optional ProteinInteractionHunter bridge
  pih_direct_interaction: 20      # optional ProteinInteractionHunter bridge
  external_ppi_evidence: 15       # optional STRING PPI bridge (see interaction_scoring.string_ppi_ncbi_taxon_id); provisional cap, awaiting calibration
  coexpression_evidence: 12       # optional GEO coexpression bridge (see interaction_scoring.geo_coexpression_enabled); provisional cap, awaiting calibration

# Maximum points a negative (contradicting) evidence component can subtract
# from the final score. Set to null for no cap.
negative_penalty_cap: 30

# A candidate needs at least this many active evidence categories and this
# much available evidence weight before a formal (ranked) score is
# produced at all. Candidates below this stay in the output with
# evidence_tier=Unclassified and formal_score_available=false, rather than
# being silently dropped.
minimum_evidence:
  min_categories: 1
  min_available_weight: 0

# Confidence tier thresholds. A candidate needs both the score and the
# category-count minimum to reach a tier; falling short of tier3 still
# reports Tier4_Weak (not Unclassified -- that is reserved for candidates
# that never got a formal score at all).
tiers:
  tier1_min_score: 70
  tier1_min_categories: 3
  tier2_min_score: 50
  tier2_min_categories: 2
  tier3_min_score: 25
  tier3_min_categories: 1

# Decimal places used when comparing scores for ranking ties.
tie_precision: 3

# Normalization parameters for the sequence_evidence component: converts a
# candidate's best positive BLAST hit (identity/coverage/evalue) into a
# 0.0-1.0 strength value, shared into the source_classification category
# cap above (see docs/implementation_plan_sequence_evidence.md).
#
# identity_floor/coverage_floor reuse ortholog_filter's "weak" threshold
# (config.yaml: ortholog_filter.weak.min_identity=25.0,
# min_query_coverage=50.0) rather than inventing new floor values.
# evalue_reference_ceiling matches the default BLAST evalue cutoff itself
# (config.blast.evalue=1e-5), so a hit right at the cutoff scores 0.
# identity_ceiling, coverage_ceiling (a natural 100%), and the evalue
# reference range are otherwise uncalibrated placeholders, same as the rest
# of this file. bitscore is intentionally not included: its scale depends
# on alignment length and no calibrated absolute threshold exists yet.
sequence_evidence:
  identity_floor: 25.0
  identity_ceiling: 90.0
  coverage_floor: 50.0
  coverage_ceiling: 100.0
  evalue_reference_ceiling: 1e-5
  evalue_reference_floor: 1e-100
  identity_weight: 1.0
  coverage_weight: 1.0
  evalue_weight: 1.0
